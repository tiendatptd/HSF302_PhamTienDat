<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Device Form</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input, select { padding: 5px; width: 200px; }
    </style>
</head>
<body>
<h2 th:text="${device.deviceId != null ? 'Edit Device' : 'Add New Device'}"></h2>

<form th:action="@{/devices/save}" th:object="${device}" method="post">

    <!-- Trường ID ẩn để Spring Boot biết đây là lệnh Sửa (nếu có ID) hay Thêm mới (nếu không có ID) -->
    <input type="hidden" th:field="*{deviceId}" />

    <div class="form-group">
        <label>Device Name:</label>
        <input type="text" th:field="*{deviceName}" required />
    </div>

    <div class="form-group">
        <label>Status:</label>
        <input type="text" th:field="*{status}" />
    </div>

    <!-- Dropdown chọn Category -->
    <div class="form-group">
        <label>Category:</label>
        <select th:field="*{category.id}">
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.categoryName}">
            </option>
        </select>
    </div>

    <button type="submit" style="margin-top: 10px; padding: 5px 15px;">Save</button>
    <a href="/devices" style="margin-left: 10px;">Cancel</a>
</form>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
