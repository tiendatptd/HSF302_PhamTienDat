<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Student Management</title>

    <!-- Import Bootstrap CSS từ thư mục vendor -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">

    <!-- Import Bootstrap Icons (nếu bạn dùng icon) -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">

    <!-- Import file CSS custom của bạn -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <!-- Thay thế text title -->
        <a class="navbar-brand" th:href="@{/students}" th:text="#{app.title}">Hệ thống Quản lý Sinh viên</a>

        <!-- Nút chuyển ngôn ngữ -->
        <div class="ms-auto">
            <a th:href="@{${requestURI}(lang='en')}" class="text-white text-decoration-none me-2" th:text="#{lang.en}">English</a>
            <span class="text-white">|</span>
            <a th:href="@{${requestURI}(lang='vi')}" class="text-white text-decoration-none ms-2" th:text="#{lang.vi}">Tiếng Việt</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Chỗ này sẽ được thay thế bằng nội dung của các trang con -->
    <div layout:fragment="content"></div>
</div>
</body>
</html>
