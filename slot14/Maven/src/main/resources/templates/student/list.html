<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base.html}">
<head>
    <title>Danh sách Sinh viên</title>
</head>
<body>
<!-- Modal Xác nhận xóa -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Xác nhận xóa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Bạn có chắc chắn muốn xóa sinh viên này không? Hành động này không thể hoàn tác.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <a id="btnConfirmDelete" href="" class="btn btn-danger">Xóa</a>
            </div>
        </div>
    </div>
</div>

<!-- Script để truyền URL động vào nút Xóa trong Modal -->
<script>
    function setDeleteUrl(url) {
        document.getElementById('btnConfirmDelete').href = url;
    }
</script>
<div layout:fragment="content">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách Sinh viên</h2>
        <div>
            <a th:href="@{/students/export}" class="btn btn-success me-2">Xuất CSV</a>
            <a th:href="@{/students/create}" class="btn btn-primary">Thêm sinh viên mới</a>
        </div>
    </div>
    <!-- Thông báo Success -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/students}" method="get" class="d-flex">
                <input type="text" name="keyword" class="form-control me-2" placeholder="Nhập tên sinh viên cần tìm..." th:value="${keyword}">
                <button type="submit" class="btn btn-outline-success">Tìm kiếm</button>
                <a th:href="@{/students}" class="btn btn-outline-secondary ms-2">Hủy</a>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>
                <a th:href="@{/students(pageNo=${currentPage}, keyword=${keyword}, sortField='name', sortDir=${reverseSortDir})}">
                    Tên <span th:if="${sortField == 'name'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Email</th>
            <th>Ngày sinh</th>
            <th>
                <a th:href="@{/students(pageNo=${currentPage}, keyword=${keyword}, sortField='gpa', sortDir=${reverseSortDir})}">
                    GPA <span th:if="${sortField == 'gpa'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.birthDate}"></td>
            <td th:text="${student.gpa}"></td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-warning">Sửa</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/students(pageNo=${currentPage - 1}, keyword=${keyword})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/students(pageNo=${i}, keyword=${keyword})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/students(pageNo=${i}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
