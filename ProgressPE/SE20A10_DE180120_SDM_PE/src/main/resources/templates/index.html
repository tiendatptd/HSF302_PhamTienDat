<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Device Management</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
<h2>Smart Device Management (SDM)</h2>

<!-- Nút thêm mới (chuẩn bị cho TODO 4) -->
<a href="/devices/create">Add New Device</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Device Name</th>
        <th>Status</th>
        <th>Category</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="device : ${devices}">
        <td th:text="${device.deviceId}"></td>
        <td th:text="${device.deviceName}"></td>
        <td th:text="${device.status}"></td>
        <!-- Lấy tên danh mục thông qua quan hệ N-1 -->
        <td th:text="${device.category != null ? device.category.categoryName : 'N/A'}"></td>
        <td>
            <!--  sửa/xóa  -->
            <a th:href="@{/devices/edit/{id}(id=${device.deviceId})}">Edit</a> |
            <a th:href="@{/devices/delete/{id}(id=${device.deviceId})}"
               onclick="return confirm('Are you sure you want to delete this device?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
